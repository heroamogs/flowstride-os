name: Engine checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix src/ui
      - name: Runtime dependency security
        run: npm audit --omit=dev --audit-level=high
      - name: Install matching WebAssembly build tool
        run: cargo install wasm-pack --version 0.15.0 --locked
      - run: npm run build:candidate
      - name: Install matching browsers
        run: node node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Unit tests
        run: npm run test:unit
      - name: Security regressions
        run: npm run test:security
      - name: Full regression
        env:
          FLOWSTRIDE_THREE_BUILD: ${{ github.workspace }}/node_modules/three/build
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum npm test
          else
            npm test
          fi
      - name: Verify package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Retain results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: engine-evidence-${{ matrix.os }}-${{ matrix.node }}
          path: flowstride-artifacts/
          if-no-files-found: ignore
          retention-days: 7
